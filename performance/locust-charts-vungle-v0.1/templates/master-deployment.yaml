apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "locust.fullname" . }}-master
  labels:
    component: master
{{ include "locust.labels" . | indent 4 }}
spec:
  selector:
    matchLabels:
      component: master
      {{- include "locust.selectorLabels" . | nindent 6 }}
  replicas: 1
{{- with .Values.master.strategy }}
  strategy:
{{ toYaml . | trim | indent 4 }}
{{- end }}
  template:
    metadata:
      annotations:
        checksum/config-config: {{ include (print $.Template.BasePath "/configmap-config.yaml") . | sha256sum }}
        checksum/config-secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        component: master
        {{- include "locust.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      serviceAccountName: {{ template "locust.fullname" . }}-master
      initContainers:
      # This container clones the desired git repo to the EmptyDir volume.
      - image: us.gcr.io/k8s-artifacts-prod/git-sync/git-sync:v3.3.2
        name: git-sync-sidecar
        args:
          - "-repo=https://github.com/Vungle/qa-platform-api.git"
          - "-branch={{ .Values.loadtest.branch }}"
          - "-depth=1"
          - "-max-sync-failures=6"
          - "-wait=10" # max-sync-failures=6 * wait=10 = 60 seconds maximum runtime for the init container
          - "-one-time=true" # exit after the first sync (we just want to initialize the file system)
          - "-root=/repo"
          - "-dest=from-github"
          - "-username=ZW1pbHktNTdibG9ja3M="
          - "-password=$(repo-token)"
#          - "-ssh=true"
        volumeMounts:
          - name: git-repo
            mountPath: /repo
            readOnly: false
        securityContext:
          runAsUser: 65533 # git-sync-user
        env:
{{- range $key, $value := .Values.loadtest.environment_external_secret }}
          - name: {{ $value }}
            valueFrom:
              secretKeyRef:
                name: {{ $key }}
                key: {{ $value }}
{{- end }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ if .Values.master.image }}{{ .Values.master.image }}{{ else }}{{ .Values.image.repository }}:{{ .Values.image.tag }}{{ end }}"
{{- with .Values.master.command }}
        command:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- if .Values.master.args }}
        args:
        {{- toYaml .Values.master.args | nindent 8 }}
{{ else if .Values.master.args_include_default }}
        args:
          - --master
          - --locustfile=/mnt/locust/from-github/performance/testcases/{{ .Values.loadtest.locust_locustfile }}
          - --host={{ .Values.loadtest.locust_host }}
          - --loglevel={{ .Values.master.logLevel }}
          - --html=/mnt/locust/{{.Values.loadtest.html}}
          - --csv=/mnt/locust/{{.Values.loadtest.csv}}
{{- if .Values.loadtest.headless }}
          - --headless
          - --users={{ .Values.loadtest.users }}
          - --spawn-rate={{ .Values.loadtest.spawn_rate }}
          - --run-time={{ .Values.loadtest.run_time }}
{{- end }}
{{- end }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        resources:
{{ toYaml .Values.master.resources | indent 10 }}
        volumeMounts:
          - name: git-repo
            mountPath: /mnt/locust
          - name: config
            mountPath: /config
{{- if .Values.extraConfigMaps }}
{{- range $key, $value := .Values.extraConfigMaps }}
          - name: {{ $key }}
            mountPath: {{ $value }}
{{- end }}
{{- end}}
        env:
          - name: LOCUST_HOST
            value: "{{ .Values.loadtest.locust_host }}"
{{- range $key, $value := .Values.loadtest.environment }}
          - name: {{ $key }}
            value: {{ $value | quote }}
{{- end }}
{{- range $key, $value := .Values.master.environment }}
          - name: {{ $key }}
            value: {{ $value | quote }}
{{- end }}
{{- range $key, $value := .Values.loadtest.environment_secret }}
          - name: {{ $key }}
            valueFrom:
              secretKeyRef:
                name: {{ template "locust.fullname" $ }}
                key: {{ $key }}
{{- end }}
{{- range $key, $value := .Values.loadtest.environment_external_secret }}
          - name: {{ $value }}
            valueFrom:
              secretKeyRef:
                name: {{ $key }}
                key: {{ $value }}
{{- end }}
        ports:
          - containerPort: 8089
            name: loc-master-web
            protocol: TCP
          - containerPort: 5557
            name: loc-master-p1
            protocol: TCP
          - containerPort: 5558
            name: loc-master-p2
            protocol: TCP
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 2
{{- if .Values.loadtest.headless }}
          tcpSocket:
            port: 5557
{{ else }}
          httpGet:
            path: /
            port: 8089
{{- end }}
      imagePullSecrets:
        - name: vungleregistrykey
      restartPolicy: Always
      volumes:
        - name: git-repo
          emptyDir: {}
        - name: config
          configMap:
            name: {{ template "locust.fullname" . }}-config
{{- if .Values.extraConfigMaps }}
{{- range $key, $value := .Values.extraConfigMaps }}
        - name: {{ $key }}
          configMap:
            name: {{ $key }}
{{- end }}
{{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
